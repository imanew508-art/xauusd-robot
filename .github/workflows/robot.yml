name: xauusd-robot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xauusd-robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run robot (one cycle)
        working-directory: cloud_repo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python robot.py once --skip-closed
      - name: Save state
        run: |
          mkdir -p cloud_repo/data
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git add cloud_repo/data
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase -q && git push -q)
